plugins {
    id 'com.android.application'
}

android {
    namespace 'com.legioesdoeclipse.dream'
    compileSdk 35

    defaultConfig {
        applicationId "com.legioesdoeclipse.dream"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-dream"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
