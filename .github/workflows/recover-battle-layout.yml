name: Recover battle layout
on:
  push:
    branches: [main]
    paths: [".github/workflows/recover-battle-layout.yml"]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          echo  | base64 -d | gunzip > /tmp/recover.py
          python3 /tmp/recover.py
